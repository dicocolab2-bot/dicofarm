<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vale Dourado 3D</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #1a1a2e; font-family: 'Segoe UI', sans-serif; }
        
        /* UI Overlay */
        #ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }
        
        #ui-overlay > * { pointer-events: auto; }
        
        /* Header */
        #header {
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(10px);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid #f5c542;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        #header .title {
            font-size: 1.5rem;
            font-weight: bold;
            color: #f5c542;
            text-shadow: 0 2px 10px rgba(245,197,66,0.3);
        }
        
        #header .title span { color: #fff; }
        
        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        
        .resource-display {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #fff;
            font-size: 0.9rem;
            background: rgba(255,255,255,0.1);
            padding: 5px 12px;
            border-radius: 20px;
        }
        
        .resource-display .icon { font-size: 1.2rem; }
        .resource-display .value { font-weight: bold; }
        
        .coin-display {
            background: #f5c542;
            color: #1a1a2e;
            padding: 5px 16px;
            border-radius: 20px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            transition: all 0.2s;
            pointer-events: auto;
        }
        
        .btn:hover { transform: scale(1.05); }
        .btn:active { transform: scale(0.95); }
        
        .btn-primary { background: #4CAF50; color: white; }
        .btn-primary:hover { background: #45a049; }
        .btn-danger { background: #f44336; color: white; }
        .btn-danger:hover { background: #da190b; }
        .btn-info { background: #2196F3; color: white; }
        .btn-info:hover { background: #0b7dda; }
        .btn-warning { background: #ff9800; color: white; }
        .btn-warning:hover { background: #e68a00; }
        .btn-gold { background: #f5c542; color: #1a1a2e; }
        .btn-gold:hover { background: #e6b332; }
        
        /* Sidebar */
        #sidebar {
            position: absolute;
            right: 20px;
            top: 80px;
            width: 280px;
            max-height: calc(100vh - 120px);
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 15px;
            overflow-y: auto;
            border: 1px solid rgba(255,255,255,0.1);
            transition: transform 0.3s ease;
        }
        
        #sidebar::-webkit-scrollbar { width: 6px; }
        #sidebar::-webkit-scrollbar-track { background: rgba(255,255,255,0.05); border-radius: 10px; }
        #sidebar::-webkit-scrollbar-thumb { background: #f5c542; border-radius: 10px; }
        
        #sidebar.hidden {
            transform: translateX(320px);
        }
        
        .sidebar-title {
            color: #fff;
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 12px;
            border-bottom: 2px solid #f5c542;
            padding-bottom: 8px;
        }
        
        .sidebar-item {
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid transparent;
        }
        
        .sidebar-item:hover {
            background: rgba(255,255,255,0.1);
            border-color: #f5c542;
        }
        
        .sidebar-item.selected {
            border-color: #f5c542;
            background: rgba(245,197,66,0.15);
        }
        
        .sidebar-item .info { color: #ccc; font-size: 0.8rem; }
        .sidebar-item .name { color: #fff; font-weight: 600; }
        .sidebar-item .cost { color: #f5c542; font-weight: bold; }
        .sidebar-item .locked { color: #f44336; font-size: 0.7rem; }
        
        .sidebar-item .icon { font-size: 1.5rem; margin-right: 8px; }
        
        /* Toast */
        #toast-container {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            pointer-events: none;
        }
        
        .toast {
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(10px);
            color: white;
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 500;
            animation: toastIn 0.3s ease;
            border: 1px solid rgba(255,255,255,0.1);
            pointer-events: auto;
        }
        
        .toast.success { border-color: #4CAF50; }
        .toast.error { border-color: #f44336; }
        .toast.info { border-color: #2196F3; }
        
        @keyframes toastIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes toastOut {
            from { opacity: 1; transform: translateY(0); }
            to { opacity: 0; transform: translateY(-20px); }
        }
        
        /* Controls hint */
        #controls-hint {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.5);
            font-size: 0.8rem;
            background: rgba(0,0,0,0.5);
            padding: 8px 16px;
            border-radius: 20px;
            backdrop-filter: blur(5px);
            pointer-events: none;
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            #sidebar {
                right: 10px;
                width: 240px;
                top: 70px;
                padding: 10px;
                font-size: 0.8rem;
            }
            #header .title { font-size: 1rem; }
            .resource-display { font-size: 0.7rem; padding: 3px 8px; }
            .btn { padding: 5px 10px; font-size: 0.7rem; }
        }
    </style>
</head>
<body>

<!-- UI Overlay -->
<div id="ui-overlay">
    <!-- Header -->
    <div id="header">
        <div class="title">🏡 Vale <span>Dourado</span></div>
        <div class="header-right">
            <div class="resource-display"><span class="icon">🌾</span><span class="value" id="res-wheat">0</span></div>
            <div class="resource-display"><span class="icon">🌽</span><span class="value" id="res-corn">0</span></div>
            <div class="resource-display"><span class="icon">🥕</span><span class="value" id="res-carrot">0</span></div>
            <div class="resource-display"><span class="icon">🧂</span><span class="value" id="res-flour">0</span></div>
            <div class="resource-display"><span class="icon">🥚</span><span class="value" id="res-egg">0</span></div>
            <div class="resource-display"><span class="icon">🍞</span><span class="value" id="res-bread">0</span></div>
            <div class="coin-display">🪙 <span id="coins-display">200</span></div>
            <button class="btn btn-info" id="btn-toggle-sidebar">📋</button>
            <button class="btn btn-gold" id="btn-save">💾</button>
            <button class="btn btn-gold" id="btn-load">📂</button>
        </div>
    </div>
    
    <!-- Sidebar -->
    <div id="sidebar">
        <div class="sidebar-title">🏗️ Construir</div>
        <div id="build-list"></div>
        <div style="margin-top:12px;border-top:1px solid rgba(255,255,255,0.1);padding-top:12px;">
            <button class="btn btn-danger" id="btn-destroy-mode" style="width:100%;">🗑️ Modo Destruir</button>
            <button class="btn btn-primary" id="btn-expand" style="width:100%;margin-top:8px;">🌾 Expandir Terreno</button>
        </div>
    </div>
    
    <!-- Toast -->
    <div id="toast-container"></div>
    
    <!-- Controls hint -->
    <div id="controls-hint">🖱️ Clique esquerdo: construir • Clique direito: colher • Rolar: zoom • Arrastar: rotacionar</div>
</div>

<!-- Three.js -->
<script type="importmap">
{
    "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ============================================================
//  CONFIGURAÇÃO
// ============================================================
const GRID_SIZE = 6;
const TILE_SIZE = 2;
const TILE_OFFSET = (GRID_SIZE - 1) * TILE_SIZE / 2;

const RESOURCES = {
    wheat: { name: 'Trigo', icon: '🌾', sellPrice: 2 },
    corn: { name: 'Milho', icon: '🌽', sellPrice: 3 },
    carrot: { name: 'Cenoura', icon: '🥕', sellPrice: 5 },
    flour: { name: 'Farinha', icon: '🧂', sellPrice: 10 },
    egg: { name: 'Ovos', icon: '🥚', sellPrice: 8 },
    bread: { name: 'Pão', icon: '🍞', sellPrice: 22 },
};

const BUILDABLES = {
    wheat_field: {
        cat: 'crop',
        name: 'Campo de Trigo',
        icon: '🌾',
        cost: 10,
        growTime: 30,
        yieldRes: 'wheat',
        yieldAmt: 3,
        levelReq: 1,
        color: 0x4CAF50,
        model: 'crop'
    },
    corn_field: {
        cat: 'crop',
        name: 'Campo de Milho',
        icon: '🌽',
        cost: 25,
        growTime: 45,
        yieldRes: 'corn',
        yieldAmt: 3,
        levelReq: 2,
        color: 0x8BC34A,
        model: 'crop'
    },
    carrot_field: {
        cat: 'crop',
        name: 'Campo de Cenoura',
        icon: '🥕',
        cost: 45,
        growTime: 60,
        yieldRes: 'carrot',
        yieldAmt: 3,
        levelReq: 3,
        color: 0xFF9800,
        model: 'crop'
    },
    mill: {
        cat: 'factory',
        name: 'Moinho',
        icon: '⚙️',
        cost: 60,
        time: 25,
        input: { wheat: 3 },
        outputRes: 'flour',
        outputAmt: 2,
        levelReq: 1,
        color: 0x78909C,
        model: 'factory'
    },
    coop: {
        cat: 'factory',
        name: 'Galinheiro',
        icon: '🐔',
        cost: 90,
        time: 40,
        input: { corn: 3 },
        outputRes: 'egg',
        outputAmt: 3,
        levelReq: 2,
        color: 0xD32F2F,
        model: 'factory'
    },
    bakery: {
        cat: 'factory',
        name: 'Padaria',
        icon: '🍞',
        cost: 150,
        time: 35,
        input: { flour: 2, egg: 1 },
        outputRes: 'bread',
        outputAmt: 2,
        levelReq: 3,
        color: 0x8D6E63,
        model: 'factory'
    },
};

const LEVEL_THRESHOLDS = [0, 100, 300, 600, 1000, 1800, 2800];
const SLOT_UPGRADE_COST = [50, 100, 200, 350, 550, 800];

// ============================================================
//  ESTADO
// ============================================================
let state = {
    coins: 200,
    totalEarned: 200,
    resources: { wheat: 0, corn: 0, carrot: 0, flour: 0, egg: 0, bread: 0 },
    grid: [],
    selectedBuild: null,
    destroyMode: false,
    gridSize: GRID_SIZE,
};

// Inicializar grid
function initGrid() {
    const size = state.gridSize || GRID_SIZE;
    state.grid = Array.from({ length: size * size }, () => ({
        key: null,
        stage: null,
        progress: 0,
        meshGroup: null,
    }));
}

initGrid();

// ============================================================
//  CENA THREE.JS
// ============================================================
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87CEEB);
scene.fog = new THREE.Fog(0x87CEEB, 25, 40);

// Câmera Isométrica
const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(18, 16, 18);
camera.lookAt(0, 0, 0);

// Renderer
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
document.body.prepend(renderer.domElement);

// Controls
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.5, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.maxPolarAngle = Math.PI / 2.4;
controls.minPolarAngle = Math.PI / 4;
controls.minDistance = 6;
controls.maxDistance = 30;
controls.update();

// ============================================================
//  LUZES
// ============================================================
const ambientLight = new THREE.AmbientLight(0x8899bb, 0.5);
scene.add(ambientLight);

const hemisphereLight = new THREE.HemisphereLight(0x87CEEB, 0x3e7a3e, 0.6);
scene.add(hemisphereLight);

const sunLight = new THREE.DirectionalLight(0xffeedd, 1.5);
sunLight.position.set(15, 25, 10);
sunLight.castShadow = true;
sunLight.shadow.mapSize.width = 4096;
sunLight.shadow.mapSize.height = 4096;
sunLight.shadow.camera.near = 0.1;
sunLight.shadow.camera.far = 50;
sunLight.shadow.camera.left = -20;
sunLight.shadow.camera.right = 20;
sunLight.shadow.camera.top = 20;
sunLight.shadow.camera.bottom = -20;
scene.add(sunLight);

const fillLight = new THREE.DirectionalLight(0x8888ff, 0.3);
fillLight.position.set(-10, 5, -10);
scene.add(fillLight);

// ============================================================
//  CRIAR ELEMENTOS 3D
// ============================================================
const tileMeshes = [];
const tileData = [];

// Texturas de grama
function createGrassTexture() {
    const canvas = document.createElement('canvas');
    canvas.width = 128;
    canvas.height = 128;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#4CAF50';
    ctx.fillRect(0, 0, 128, 128);
    for (let i = 0; i < 2000; i++) {
        const x = Math.random() * 128;
        const y = Math.random() * 128;
        const size = 1 + Math.random() * 2;
        const shade = 60 + Math.random() * 80;
        ctx.fillStyle = `rgb(${shade}, ${shade + 60}, ${shade - 20})`;
        ctx.fillRect(x, y, size, size);
    }
    return new THREE.CanvasTexture(canvas);
}

const grassTexture = createGrassTexture();

// Criar tile 3D
function createTile3D(x, z, color = 0x4CAF50, isOccupied = false) {
    const group = new THREE.Group();
    
    // Base do tile
    const baseGeo = new THREE.BoxGeometry(TILE_SIZE - 0.1, 0.3, TILE_SIZE - 0.1);
    const baseMat = new THREE.MeshStandardMaterial({
        color: color,
        roughness: 0.8,
        metalness: 0.1,
        map: grassTexture,
    });
    const base = new THREE.Mesh(baseGeo, baseMat);
    base.position.y = 0.15;
    base.receiveShadow = true;
    base.castShadow = true;
    group.add(base);
    
    // Borda
    const borderGeo = new THREE.EdgesGeometry(new THREE.BoxGeometry(TILE_SIZE - 0.05, 0.35, TILE_SIZE - 0.05));
    const borderMat = new THREE.LineBasicMaterial({ 
        color: isOccupied ? 0x8BC34A : 0x2d5a1e, 
        transparent: true, 
        opacity: isOccupied ? 0.5 : 0.2 
    });
    const border = new THREE.LineSegments(borderGeo, borderMat);
    border.position.y = 0.15;
    group.add(border);
    
    group.position.set(x, 0, z);
    scene.add(group);
    
    return group;
}

// Criar planta (modelo procedural)
function createPlantModel(type = 'wheat', progress = 0) {
    const group = new THREE.Group();
    const isReady = progress >= 1;
    const scale = 0.5 + progress * 0.8;
    
    // Caule
    const stemGeo = new THREE.CylinderGeometry(0.04 * scale, 0.06 * scale, 0.4 * scale, 6);
    const stemMat = new THREE.MeshStandardMaterial({ color: 0x2d8a4e, roughness: 0.8 });
    const stem = new THREE.Mesh(stemGeo, stemMat);
    stem.position.y = 0.2 * scale;
    stem.castShadow = true;
    group.add(stem);
    
    if (type === 'wheat') {
        // Folhas de trigo
        for (let i = 0; i < 4; i++) {
            const leafGeo = new THREE.PlaneGeometry(0.15 * scale, 0.3 * scale);
            const leafMat = new THREE.MeshStandardMaterial({ 
                color: isReady ? 0xf5c542 : 0x4CAF50,
                side: THREE.DoubleSide,
                roughness: 0.8
            });
            const leaf = new THREE.Mesh(leafGeo, leafMat);
            leaf.position.y = 0.25 * scale + i * 0.08 * scale;
            leaf.rotation.y = (i / 4) * Math.PI * 2;
            leaf.rotation.z = 0.3;
            leaf.castShadow = true;
            group.add(leaf);
        }
        // Espiga
        if (isReady) {
            const headGeo = new THREE.SphereGeometry(0.08 * scale, 6, 6);
            const headMat = new THREE.MeshStandardMaterial({ color: 0xf5c542, roughness: 0.6, metalness: 0.2 });
            const head = new THREE.Mesh(headGeo, headMat);
            head.position.y = 0.5 * scale;
            head.scale.y = 1.5;
            head.castShadow = true;
            group.add(head);
        }
    } else if (type === 'corn') {
        // Folhas de milho
        for (let i = 0; i < 5; i++) {
            const leafGeo = new THREE.PlaneGeometry(0.2 * scale, 0.4 * scale);
            const leafMat = new THREE.MeshStandardMaterial({ 
                color: isReady ? 0xf5c542 : 0x66BB6A,
                side: THREE.DoubleSide,
                roughness: 0.8
            });
            const leaf = new THREE.Mesh(leafGeo, leafMat);
            leaf.position.y = 0.2 * scale + i * 0.1 * scale;
            leaf.rotation.y = (i / 5) * Math.PI * 2 + 0.2;
            leaf.rotation.x = 0.4;
            leaf.castShadow = true;
            group.add(leaf);
        }
        // Espiga de milho
        if (isReady) {
            const cobGeo = new THREE.CylinderGeometry(0.06 * scale, 0.08 * scale, 0.25 * scale, 8);
            const cobMat = new THREE.MeshStandardMaterial({ color: 0xf5c542, roughness: 0.7 });
            const cob = new THREE.Mesh(cobGeo, cobMat);
            cob.position.y = 0.45 * scale;
            cob.rotation.x = 0.2;
            cob.castShadow = true;
            group.add(cob);
        }
    } else if (type === 'carrot') {
        // Folhas de cenoura
        for (let i = 0; i < 3; i++) {
            const leafGeo = new THREE.PlaneGeometry(0.12 * scale, 0.25 * scale);
            const leafMat = new THREE.MeshStandardMaterial({ 
                color: isReady ? 0xFF9800 : 0x4CAF50,
                side: THREE.DoubleSide,
                roughness: 0.8
            });
            const leaf = new THREE.Mesh(leafGeo, leafMat);
            leaf.position.y = 0.2 * scale + i * 0.05 * scale;
            leaf.rotation.y = (i / 3) * Math.PI * 2;
            leaf.rotation.z = 0.5;
            leaf.castShadow = true;
            group.add(leaf);
        }
        // Cenoura
        if (isReady) {
            const carrotGeo = new THREE.ConeGeometry(0.08 * scale, 0.3 * scale, 8);
            const carrotMat = new THREE.MeshStandardMaterial({ color: 0xFF6F00, roughness: 0.7 });
            const carrot = new THREE.Mesh(carrotGeo, carrotMat);
            carrot.position.y = 0.15 * scale;
            carrot.castShadow = true;
            group.add(carrot);
        }
    }
    
    return group;
}

// Criar fábrica (modelo procedural)
function createFactoryModel(type = 'mill', progress = 0) {
    const group = new THREE.Group();
    const isReady = progress >= 1;
    const isWorking = progress > 0 && progress < 1;
    
    if (type === 'mill') {
        // Base
        const baseGeo = new THREE.CylinderGeometry(0.4, 0.5, 0.3, 8);
        const baseMat = new THREE.MeshStandardMaterial({ color: 0x78909C, roughness: 0.9 });
        const base = new THREE.Mesh(baseGeo, baseMat);
        base.position.y = 0.15;
        base.castShadow = true;
        group.add(base);
        
        // Moinho
        const bodyGeo = new THREE.CylinderGeometry(0.3, 0.35, 0.5, 8);
        const bodyMat = new THREE.MeshStandardMaterial({ color: isReady ? 0x8D6E63 : 0x78909C, roughness: 0.8 });
        const body = new THREE.Mesh(bodyGeo, bodyMat);
        body.position.y = 0.4;
        body.castShadow = true;
        group.add(body);
        
        // Pedra de moinho (girando se estiver trabalhando)
        const stoneGeo = new THREE.CylinderGeometry(0.25, 0.25, 0.08, 8);
        const stoneMat = new THREE.MeshStandardMaterial({ color: 0x5D4037, roughness: 0.9 });
        const stone = new THREE.Mesh(stoneGeo, stoneMat);
        stone.position.y = 0.6;
        stone.castShadow = true;
        if (isWorking) {
            stone.userData.rotating = true;
        }
        group.add(stone);
        
        // Chaminé
        const chimneyGeo = new THREE.CylinderGeometry(0.05, 0.08, 0.2, 6);
        const chimneyMat = new THREE.MeshStandardMaterial({ color: 0x5D4037, roughness: 0.9 });
        const chimney = new THREE.Mesh(chimneyGeo, chimneyMat);
        chimney.position.set(0.2, 0.5, 0.2);
        chimney.castShadow = true;
        group.add(chimney);
        
    } else if (type === 'coop') {
        // Base
        const baseGeo = new THREE.BoxGeometry(0.7, 0.2, 0.7);
        const baseMat = new THREE.MeshStandardMaterial({ color: 0x8D6E63, roughness: 0.9 });
        const base = new THREE.Mesh(baseGeo, baseMat);
        base.position.y = 0.1;
        base.castShadow = true;
        group.add(base);
        
        // Corpo
        const bodyGeo = new THREE.BoxGeometry(0.6, 0.35, 0.6);
        const bodyMat = new THREE.MeshStandardMaterial({ 
            color: isReady ? 0xD32F2F : 0x8D6E63, 
            roughness: 0.8 
        });
        const body = new THREE.Mesh(bodyGeo, bodyMat);
        body.position.y = 0.3;
        body.castShadow = true;
        group.add(body);
        
        // Telhado
        const roofGeo = new THREE.ConeGeometry(0.5, 0.3, 4);
        const roofMat = new THREE.MeshStandardMaterial({ color: 0xD32F2F, roughness: 0.7 });
        const roof = new THREE.Mesh(roofGeo, roofMat);
        roof.position.y = 0.55;
        roof.rotation.y = Math.PI / 4;
        roof.castShadow = true;
        group.add(roof);
        
        // Galinha (se estiver pronta)
        if (isReady) {
            const chickenGroup = new THREE.Group();
            // Corpo
            const bodyChicken = new THREE.Mesh(
                new THREE.SphereGeometry(0.1, 6, 6),
                new THREE.MeshStandardMaterial({ color: 0xf5c542, roughness: 0.7 })
            );
            bodyChicken.scale.set(1.2, 1, 0.8);
            chickenGroup.add(bodyChicken);
            // Cabeça
            const headChicken = new THREE.Mesh(
                new THREE.SphereGeometry(0.07, 6, 6),
                new THREE.MeshStandardMaterial({ color: 0xf5c542, roughness: 0.7 })
            );
            headChicken.position.set(0.12, 0.05, 0);
            chickenGroup.add(headChicken);
            // Bico
            const beak = new THREE.Mesh(
                new THREE.ConeGeometry(0.02, 0.04, 4),
                new THREE.MeshStandardMaterial({ color: 0xff6f00, roughness: 0.8 })
            );
            beak.position.set(0.18, 0.02, 0);
            beak.rotation.z = 0.2;
            chickenGroup.add(beak);
            
            chickenGroup.position.set(0, 0.25, 0);
            chickenGroup.scale.set(0.8, 0.8, 0.8);
            group.add(chickenGroup);
        }
        
    } else if (type === 'bakery') {
        // Base
        const baseGeo = new THREE.BoxGeometry(0.7, 0.15, 0.7);
        const baseMat = new THREE.MeshStandardMaterial({ color: 0x8D6E63, roughness: 0.9 });
        const base = new THREE.Mesh(baseGeo, baseMat);
        base.position.y = 0.075;
        base.castShadow = true;
        group.add(base);
        
        // Corpo
        const bodyGeo = new THREE.BoxGeometry(0.6, 0.4, 0.6);
        const bodyMat = new THREE.MeshStandardMaterial({ 
            color: isReady ? 0xFF9800 : 0x8D6E63, 
            roughness: 0.8 
        });
        const body = new THREE.Mesh(bodyGeo, bodyMat);
        body.position.y = 0.3;
        body.castShadow = true;
        group.add(body);
        
        // Telhado
        const roofGeo = new THREE.ConeGeometry(0.5, 0.25, 4);
        const roofMat = new THREE.MeshStandardMaterial({ color: 0xD32F2F, roughness: 0.7 });
        const roof = new THREE.Mesh(roofGeo, roofMat);
        roof.position.y = 0.55;
        roof.rotation.y = Math.PI / 4;
        roof.castShadow = true;
        group.add(roof);
        
        // Pão (se estiver pronto)
        if (isReady) {
            const breadGroup = new THREE.Group();
            const breadMat = new THREE.MeshStandardMaterial({ color: 0xf5c542, roughness: 0.7 });
            const bread1 = new THREE.Mesh(new THREE.SphereGeometry(0.08, 6, 6), breadMat);
            bread1.scale.set(1.2, 0.8, 0.8);
            bread1.position.set(-0.08, 0.15, 0);
            breadGroup.add(bread1);
            const bread2 = new THREE.Mesh(new THREE.SphereGeometry(0.08, 6, 6), breadMat);
            bread2.scale.set(1.2, 0.8, 0.8);
            bread2.position.set(0.08, 0.15, 0);
            breadGroup.add(bread2);
            group.add(breadGroup);
        }
    }
    
    group.position.y = 0.3;
    return group;
}

// ============================================================
//  FUNÇÕES DO JOGO
// ============================================================
function getLevel() {
    let lvl = 1;
    for (let i = 1; i < LEVEL_THRESHOLDS.length; i++) {
        if (state.totalEarned >= LEVEL_THRESHOLDS[i]) lvl = i + 1;
    }
    return Math.min(lvl, LEVEL_THRESHOLDS.length);
}

function fmt(n) { return Math.floor(n).toLocaleString('pt-BR'); }

function toast(msg, type = 'info') {
    const container = document.getElementById('toast-container');
    const el = document.createElement('div');
    el.className = `toast ${type}`;
    el.textContent = msg;
    container.appendChild(el);
    setTimeout(() => {
        el.style.animation = 'toastOut 0.3s ease';
        setTimeout(() => el.remove(), 300);
    }, 2500);
}

function hasEnough(inputDict) {
    return Object.entries(inputDict).every(([res, qty]) => (state.resources[res] || 0) >= qty);
}

function consume(inputDict) {
    Object.entries(inputDict).forEach(([res, qty]) => state.resources[res] -= qty);
}

function getTileIndex(col, row) {
    return row * state.gridSize + col;
}

function getTilePos(index) {
    const col = index % state.gridSize;
    const row = Math.floor(index / state.gridSize);
    const x = col * TILE_SIZE - TILE_OFFSET;
    const z = row * TILE_SIZE - TILE_OFFSET;
    return { col, row, x, z };
}

// ============================================================
//  RENDERIZAR GRID 3D
// ============================================================
function renderGrid3D() {
    // Limpar tiles antigos
    tileMeshes.forEach(mesh => scene.remove(mesh));
    tileMeshes.length = 0;
    tileData.length = 0;
    
    const size = state.gridSize;
    
    for (let row = 0; row < size; row++) {
        for (let col = 0; col < size; col++) {
            const idx = getTileIndex(col, row);
            const tile = state.grid[idx];
            const pos = getTilePos(idx);
            
            const isOccupied = tile.key !== null;
            const color = isOccupied ? 0x6d8a4e : 0x4CAF50;
            
            const group = createTile3D(pos.x, pos.z, color, isOccupied);
            tileMeshes.push(group);
            tileData.push({ idx, col, row, group, tile });
            
            // Se ocupado, adicionar modelo
            if (tile.key) {
                addModelToTile(idx);
            }
        }
    }
}

function addModelToTile(idx) {
    const tile = state.grid[idx];
    const def = BUILDABLES[tile.key];
    if (!def) return;
    
    const pos = getTilePos(idx);
    const group = new THREE.Group();
    let model;
    
    if (def.cat === 'crop') {
        const type = tile.key.replace('_field', '');
        model = createPlantModel(type, tile.progress || 0);
    } else {
        model = createFactoryModel(tile.key, tile.progress || 0);
    }
    
    group.add(model);
    group.position.set(pos.x, 0, pos.z);
    
    // Adicionar indicador de progresso
    if (tile.stage === 'growing' || tile.stage === 'processing') {
        const progressBar = createProgressBar(tile.progress || 0);
        group.add(progressBar);
    }
    
    // Adicionar marcador de pronto
    if (tile.stage === 'ready') {
        const marker = createReadyMarker();
        group.add(marker);
    }
    
    scene.add(group);
    tile.meshGroup = group;
    tileMeshes.push(group);
}

function createProgressBar(progress) {
    const group = new THREE.Group();
    const width = 0.8;
    const height = 0.05;
    
    const bgGeo = new THREE.PlaneGeometry(width, height);
    const bgMat = new THREE.MeshStandardMaterial({ 
        color: 0x333333, 
        transparent: true, 
        opacity: 0.6,
        side: THREE.DoubleSide
    });
    const bg = new THREE.Mesh(bgGeo, bgMat);
    bg.position.y = 0.7;
    group.add(bg);
    
    const fillGeo = new THREE.PlaneGeometry(width * Math.min(progress, 1), height - 0.01);
    const fillMat = new THREE.MeshStandardMaterial({ 
        color: 0xf5c542, 
        side: THREE.DoubleSide 
    });
    const fill = new THREE.Mesh(fillGeo, fillMat);
    fill.position.set((progress - 0.5) * width * 0.5, 0.7, 0.01);
    group.add(fill);
    
    return group;
}

function createReadyMarker() {
    const group = new THREE.Group();
    
    // Anel brilhante
    const ringGeo = new THREE.RingGeometry(0.2, 0.3, 16);
    const ringMat = new THREE.MeshStandardMaterial({
        color: 0xf5c542,
        emissive: 0xf5c542,
        emissiveIntensity: 0.5,
        transparent: true,
        opacity: 0.8,
        side: THREE.DoubleSide
    });
    const ring = new THREE.Mesh(ringGeo, ringMat);
    ring.rotation.x = -Math.PI / 2;
    ring.position.y = 0.75;
    group.add(ring);
    
    // Estrela
    const starGroup = new THREE.Group();
    for (let i = 0; i < 5; i++) {
        const angle = (i / 5) * Math.PI * 2 - Math.PI / 2;
        const spike = new THREE.Mesh(
            new THREE.PlaneGeometry(0.04, 0.12),
            new THREE.MeshStandardMaterial({
                color: 0xf5c542,
                emissive: 0xf5c542,
                emissiveIntensity: 0.3,
                side: THREE.DoubleSide
            })
        );
        spike.position.set(Math.cos(angle) * 0.12, 0.75, Math.sin(angle) * 0.12);
        spike.rotation.y = -angle;
        starGroup.add(spike);
    }
    group.add(starGroup);
    
    return group;
}

// ============================================================
//  AÇÕES DO JOGO
// ============================================================
function selectBuild(key) {
    const def = BUILDABLES[key];
    if (getLevel() < def.levelReq) {
        toast(`🔒 Desbloqueia no nível ${def.levelReq}`, 'error');
        return;
    }
    if (state.destroyMode) toggleDestroyMode();
    state.selectedBuild = state.selectedBuild === key ? null : key;
    updateUI();
    updateSidebar();
}

function toggleDestroyMode() {
    state.destroyMode = !state.destroyMode;
    state.selectedBuild = null;
    updateUI();
    updateSidebar();
    toast(state.destroyMode ? '🗑️ Modo destruir ativado' : '🔧 Modo destruir desativado', 
          state.destroyMode ? 'error' : 'info');
}

function handleTileClick(index, isRightClick = false) {
    const tile = state.grid[index];
    const pos = getTilePos(index);
    
    // Modo destruir
    if (state.destroyMode && tile.key) {
        const def = BUILDABLES[tile.key];
        if (confirm(`Remover ${def.icon} ${def.name}?`)) {
            // Remover modelo 3D
            if (tile.meshGroup) {
                scene.remove(tile.meshGroup);
                tile.meshGroup = null;
            }
            const refund = Math.floor(def.cost * 0.5);
            state.coins += refund;
            tile.key = null;
            tile.stage = null;
            tile.progress = 0;
            toast(`🗑️ Removido! +${fmt(refund)} 🪙`, 'info');
            renderGrid3D();
            updateUI();
            updateSidebar();
        }
        return;
    }
    
    // Construir (clique esquerdo)
    if (!tile.key && !isRightClick && state.selectedBuild) {
        const def = BUILDABLES[state.selectedBuild];
        if (state.coins < def.cost) {
            toast('🪙 Moedas insuficientes!', 'error');
            return;
        }
        state.coins -= def.cost;
        tile.key = state.selectedBuild;
        tile.progress = 0;
        tile.stage = def.cat === 'crop' ? 'growing' : 'idle';
        toast(`${def.icon} ${def.name} construído!`, 'success');
        renderGrid3D();
        updateUI();
        updateSidebar();
        return;
    }
    
    // Coletar (clique direito)
    if (tile.key && isRightClick && tile.stage === 'ready') {
        const def = BUILDABLES[tile.key];
        
        if (def.cat === 'crop') {
            state.resources[def.yieldRes] = (state.resources[def.yieldRes] || 0) + def.yieldAmt;
            toast(`+${def.yieldAmt} ${def.icon} ${def.name}`, 'success');
        } else {
            state.resources[def.outputRes] = (state.resources[def.outputRes] || 0) + def.outputAmt;
            toast(`+${def.outputAmt} ${def.icon} ${def.name}`, 'success');
        }
        
        // Reiniciar
        tile.stage = def.cat === 'crop' ? 'growing' : 'idle';
        tile.progress = 0;
        
        // Remover modelo antigo
        if (tile.meshGroup) {
            scene.remove(tile.meshGroup);
            tile.meshGroup = null;
        }
        renderGrid3D();
        updateUI();
        updateSidebar();
        return;
    }
    
    // Dica
    if (tile.key && !isRightClick && tile.stage === 'ready') {
        toast(`${tile.key} pronto! Clique direito para colher`, 'info');
    }
}

function expandGrid() {
    const currentSize = state.gridSize;
    if (currentSize >= 8) {
        toast('🌾 Máximo de terrenos atingido!', 'error');
        return;
    }
    
    const level = getLevel();
    const maxSlots = Math.min(4 + Math.floor(level / 2), 8);
    
    if (currentSize >= maxSlots) {
        toast(`🔒 Nível ${level} - máximo ${maxSlots}x${maxSlots}`, 'error');
        return;
    }
    
    const costIndex = currentSize - 4;
    if (costIndex < 0 || costIndex >= SLOT_UPGRADE_COST.length) {
        toast('❌ Limite máximo!', 'error');
        return;
    }
    
    const cost = SLOT_UPGRADE_COST[costIndex];
    if (state.coins < cost) {
        toast(`💰 Preciso de ${fmt(cost)} 🪙`, 'error');
        return;
    }
    
    state.coins -= cost;
    const newSize = currentSize + 1;
    state.gridSize = newSize;
    
    // Adicionar novas linhas e colunas
    const newGrid = [];
    for (let row = 0; row < newSize; row++) {
        for (let col = 0; col < newSize; col++) {
            if (row < currentSize && col < currentSize) {
                newGrid.push(state.grid[row * currentSize + col]);
            } else {
                newGrid.push({ key: null, stage: null, progress: 0, meshGroup: null });
            }
        }
    }
    state.grid = newGrid;
    
    toast(`🌾 Expandido para ${newSize}x${newSize}!`, 'success');
    renderGrid3D();
    updateUI();
    updateSidebar();
}

// ============================================================
//  LOOP DE CRESCIMENTO
// ============================================================
function growPlants() {
    let changed = false;
    
    state.grid.forEach((tile, idx) => {
        if (!tile.key) return;
        const def = BUILDABLES[tile.key];
        if (!def) return;
        
        if (tile.stage === 'growing' || tile.stage === 'processing') {
            const maxTime = def.growTime || def.time || 30;
            tile.progress += 0.005 / (maxTime / 30);
            
            if (tile.progress >= 1) {
                tile.progress = 1;
                tile.stage = 'ready';
                changed = true;
                // Atualizar visual
                if (tile.meshGroup) {
                    scene.remove(tile.meshGroup);
                    tile.meshGroup = null;
                }
                renderGrid3D();
                toast(`⭐ ${def.name} pronto para colher!`, 'success');
            } else if (tile.progress > 0 && tile.progress < 1) {
                // Atualizar barra de progresso
                if (tile.meshGroup) {
                    // Remover barra antiga e recriar
                    const oldBar = tile.meshGroup.children.find(c => c.type === 'Group' && c.children.length > 0 && c.children[0]?.material?.color?.getHex?.() === 0x333333);
                    if (oldBar) {
                        tile.meshGroup.remove(oldBar);
                    }
                    const newBar = createProgressBar(tile.progress);
                    tile.meshGroup.add(newBar);
                }
            }
        } else if (tile.stage === 'idle' && def.cat === 'factory') {
            if (hasEnough(def.input)) {
                consume(def.input);
                tile.stage = 'processing';
                tile.progress = 0;
                changed = true;
                // Atualizar visual
                if (tile.meshGroup) {
                    scene.remove(tile.meshGroup);
                    tile.meshGroup = null;
                }
                renderGrid3D();
                toast(`⚙️ ${def.name} iniciou produção!`, 'info');
            }
        }
    });
    
    if (changed) {
        updateUI();
        updateSidebar();
    }
}

// ============================================================
//  INTERFACE
// ============================================================
function updateUI() {
    document.getElementById('coins-display').textContent = fmt(state.coins);
    Object.keys(RESOURCES).forEach(res => {
        const el = document.getElementById(`res-${res}`);
        if (el) el.textContent = fmt(state.resources[res] || 0);
    });
}

function updateSidebar() {
    const container = document.getElementById('build-list');
    const level = getLevel();
    
    let html = '';
    Object.entries(BUILDABLES).forEach(([key, def]) => {
        const locked = level < def.levelReq;
        const selected = state.selectedBuild === key;
        const costStr = def.cat === 'crop' 
            ? `🪙 ${def.cost} · ${def.growTime}s`
            : `🪙 ${def.cost} · ${def.time}s`;
        
        html += `
            <div class="sidebar-item ${selected ? 'selected' : ''}" data-build="${key}">
                <div>
                    <span class="icon">${def.icon}</span>
                    <span class="name">${def.name}</span>
                    ${locked ? '<span class="locked">🔒</span>' : ''}
                    <div class="info">${costStr}</div>
                </div>
                <div>
                    ${selected ? '✅' : locked ? '🔒' : '🪙'}
                </div>
            </div>
        `;
    });
    
    container.innerHTML = html;
    
    // Eventos
    container.querySelectorAll('.sidebar-item').forEach(el => {
        el.addEventListener('click', () => {
            selectBuild(el.dataset.build);
        });
    });
}

// ============================================================
//  SALVAR / CARREGAR
// ============================================================
function saveGame() {
    try {
        const saveData = JSON.stringify({
            coins: state.coins,
            totalEarned: state.totalEarned,
            resources: state.resources,
            grid: state.grid.map(t => ({
                key: t.key,
                stage: t.stage,
                progress: t.progress,
            })),
            gridSize: state.gridSize,
        });
        const blob = new Blob([saveData], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `vale-dourado-3d-save-${new Date().toISOString().slice(0,10)}.json`;
        a.click();
        URL.revokeObjectURL(url);
        toast('💾 Jogo salvo!', 'success');
    } catch (e) {
        toast('❌ Erro ao salvar', 'error');
    }
}

function loadGame() {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = '.json';
    input.onchange = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
            try {
                const loaded = JSON.parse(ev.target.result);
                state.coins = loaded.coins;
                state.totalEarned = loaded.totalEarned;
                state.resources = loaded.resources;
                state.gridSize = loaded.gridSize || GRID_SIZE;
                state.grid = loaded.grid.map(t => ({
                    key: t.key,
                    stage: t.stage,
                    progress: t.progress || 0,
                    meshGroup: null,
                }));
                state.selectedBuild = null;
                state.destroyMode = false;
                
                // Reconstruir cena
                renderGrid3D();
                updateUI();
                updateSidebar();
                toast('✅ Jogo carregado!', 'success');
            } catch (err) {
                toast('❌ Arquivo inválido', 'error');
            }
        };
        reader.readAsText(file);
    };
    input.click();
}

// ============================================================
//  EVENTOS
// ============================================================
// Click no tile
renderer.domElement.addEventListener('click', (e) => {
    const rect = renderer.domElement.getBoundingClientRect();
    const mouse = new THREE.Vector2(
        ((e.clientX - rect.left) / rect.width) * 2 - 1,
        -((e.clientY - rect.top) / rect.height) * 2 + 1
    );
    
    const raycaster = new THREE.Raycaster();
    raycaster.setFromCamera(mouse, camera);
    
    // Verificar colisão com tiles
    const tileGroups = tileMeshes.filter(m => m.children.length > 0);
    const intersects = raycaster.intersectObjects(tileGroups, true);
    
    if (intersects.length > 0) {
        let target = intersects[0].object;
        let group = target.parent;
        while (group && !tileMeshes.includes(group)) {
            group = group.parent;
        }
        if (group && tileMeshes.includes(group)) {
            const idx = tileData.find(d => d.group === group)?.idx;
            if (idx !== undefined) {
                handleTileClick(idx, false);
            }
        }
    }
});

// Clique direito
renderer.domElement.addEventListener('contextmenu', (e) => {
    e.preventDefault();
    const rect = renderer.domElement.getBoundingClientRect();
    const mouse = new THREE.Vector2(
        ((e.clientX - rect.left) / rect.width) * 2 - 1,
        -((e.clientY - rect.top) / rect.height) * 2 + 1
    );
    
    const raycaster = new THREE.Raycaster();
    raycaster.setFromCamera(mouse, camera);
    
    const tileGroups = tileMeshes.filter(m => m.children.length > 0);
    const intersects = raycaster.intersectObjects(tileGroups, true);
    
    if (intersects.length > 0) {
        let target = intersects[0].object;
        let group = target.parent;
        while (group && !tileMeshes.includes(group)) {
            group = group.parent;
        }
        if (group && tileMeshes.includes(group)) {
            const idx = tileData.find(d => d.group === group)?.idx;
            if (idx !== undefined) {
                handleTileClick(idx, true);
            }
        }
    }
});

// Botões UI
document.getElementById('btn-toggle-sidebar').addEventListener('click', () => {
    document.getElementById('sidebar').classList.toggle('hidden');
});

document.getElementById('btn-save').addEventListener('click', saveGame);
document.getElementById('btn-load').addEventListener('click', loadGame);
document.getElementById('btn-destroy-mode').addEventListener('click', toggleDestroyMode);
document.getElementById('btn-expand').addEventListener('click', expandGrid);

// Redimensionar
window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

// ============================================================
//  ANIMAÇÃO
// ============================================================
let time = 0;

function animate() {
    requestAnimationFrame(animate);
    
    time += 0.016;
    
    // Atualizar animações dos modelos
    tileData.forEach(({ tile, group }) => {
        if (!tile.key) return;
        const def = BUILDABLES[tile.key];
        if (!def) return;
        
        // Rotacionar moinhos
        if (tile.key === 'mill' && tile.stage === 'processing') {
            const stone = group?.children.find(c => c.type === 'Group')?.children.find(c => c.userData?.rotating);
            if (stone) {
                stone.rotation.y += 0.05;
            }
        }
        
        // Balançar plantas
        if (def.cat === 'crop' && tile.stage === 'growing') {
            const plant = group?.children.find(c => c.type === 'Group');
            if (plant) {
                const sway = Math.sin(time * 1.5 + (group.position.x + group.position.z) * 2) * 0.02;
                plant.rotation.z = sway;
            }
        }
        
        // Animar marcador de pronto
        if (tile.stage === 'ready') {
            const marker = group?.children.find(c => c.type === 'Group' && c.children.length > 0 && c.children[0]?.geometry?.type === 'RingGeometry');
            if (marker) {
                marker.rotation.y += 0.01;
                const scale = 1 + Math.sin(time * 2) * 0.05;
                marker.scale.set(scale, scale, scale);
            }
        }
    });
    
    controls.update();
    renderer.render(scene, camera);
}

// ============================================================
//  LOOP PRINCIPAL
// ============================================================
function gameLoop() {
    growPlants();
    setTimeout(gameLoop, 1000);
}

// ============================================================
//  INICIAR
// ============================================================
renderGrid3D();
updateUI();
updateSidebar();
animate();
gameLoop();

toast('🏡 Bem-vindo ao Vale Dourado 3D!', 'success');

console.log('🏡 Vale Dourado 3D iniciado!');
console.log('🌾 Clique em um tile vazio para construir');
console.log('🖱️ Clique direito para colher');
console.log('🔧 Use o botão "Modo Destruir" para remover construções');

// ============================================================
//  EXPORTAR PARA DEBUG
// ============================================================
window.__game = {
    state,
    scene,
    camera,
    controls,
    renderer,
    BUILDABLES,
    RESOURCES,
    addModelToTile,
    renderGrid3D,
    handleTileClick,
    growPlants,
    saveGame,
    loadGame,
};
</script>
