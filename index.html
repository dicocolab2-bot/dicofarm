<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vale Dourado — jogo de fazenda e vilarejo</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header id="header"></header>
    
    <div class="main">
        <aside id="sidebar"></aside>
        <section id="grid-wrap">
            <div id="placing-banner-slot"></div>
            <div id="grid"></div>
        </section>
    </div>
    
    <div class="footer-note">
        Vale Dourado — jogo original, roda 100% offline no navegador. 
        Use Salvar/Carregar para manter seu progresso entre sessões.
    </div>
    
    <div id="toast-container"></div>
    <input type="file" id="load-input" hidden accept="application/json">

    <!-- JavaScript -->
    <script src="js/assets.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/game.js"></script>
</body>
</html>
